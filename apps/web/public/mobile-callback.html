<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      var hash = window.location.hash;
      var search = window.location.search;
      if (hash || search) {
        window.location.replace('mi-album-fifa://auth/callback' + hash + search);
      } else {
        window.location.replace('mi-album-fifa://');
      }
    </script>
  </body>
</html>
