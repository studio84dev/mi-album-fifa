<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Volver a Album Fan</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f6f8fb;
      color: #172033;
    }

    main {
      width: min(88vw, 360px);
      padding: 32px 24px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(20 35 60 / 14%);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0 0 24px;
      color: #526078;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #error {
      display: none;
      color: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #f8fafc;
      }

      main {
        background: #1e293b;
      }

      p {
        color: #cbd5e1;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Inicio de sesión completado</h1>
    <p id="instructions">Pulsa el botón para volver a Album Fan y continuar.</p>
    <button id="open-app" type="button">Volver a Album Fan</button>
    <p id="error">No se encontró una dirección válida para volver a Expo Go.</p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search)
    const returnUrl = params.get('return')
    const button = document.getElementById('open-app')
    const instructions = document.getElementById('instructions')
    const error = document.getElementById('error')

    function isValidExpoGoCallback(value) {
      if (!value) return false

      try {
        const url = new URL(value)
        const isExpoProtocol = url.protocol === 'exp:' || url.protocol === 'exps:'
        return isExpoProtocol && url.pathname === '/--/auth/callback'
      } catch {
        return false
      }
    }

    if (!isValidExpoGoCallback(returnUrl)) {
      button.style.display = 'none'
      instructions.style.display = 'none'
      error.style.display = 'block'
    } else {
      button.addEventListener('click', function () {
        window.location.href = returnUrl + window.location.hash
      })
    }
  </script>
</body>

</html>
